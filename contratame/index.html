<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contrátame · José Ángel Gaytán</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#111216; --surface:#1a1d27; --ink:#f5f3ee; --soft:#b4b7c3; --line:#343947; --accent:#8ba8ff; }
  * { box-sizing:border-box; margin:0; } body { min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at 78% 12%,#304a92 0,transparent 30%),radial-gradient(circle at 10% 90%,#2a1b52 0,transparent 34%),var(--bg); color:var(--ink); font-family:"IBM Plex Sans",sans-serif; }
  main { width:min(720px,100%); padding:clamp(32px,7vw,72px); border:1px solid #ffffff18; border-radius:28px; background:color-mix(in oklch,var(--surface) 84%,transparent); box-shadow:0 28px 90px #0007; }
  .mark { width:50px; height:50px; display:grid; place-items:center; border-radius:15px; background:var(--accent); color:#121624; } .mark svg { width:25px; height:25px; }
  .eyebrow { margin-top:28px; color:var(--accent); font:600 12px "IBM Plex Mono",monospace; letter-spacing:1.3px; text-transform:uppercase; }
  h1 { max-width:14ch; margin-top:12px; font:700 clamp(42px,7vw,72px)/.98 "Space Grotesk",sans-serif; letter-spacing:-2.5px; } p { max-width:52ch; margin-top:20px; color:var(--soft); font-size:17px; line-height:1.6; }
  .actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:34px; } a { display:inline-flex; align-items:center; gap:9px; border-radius:12px; padding:13px 18px; color:var(--ink); text-decoration:none; font:600 13px "IBM Plex Mono",monospace; transition:transform .15s, border-color .2s; } a:hover { transform:translateY(-2px); } .primary { background:var(--accent); color:#10152a; } .secondary { border:1px solid var(--line); } a svg { width:16px; height:16px; }
  .note { margin-top:22px; font:400 12px "IBM Plex Mono",monospace; color:#858b9c; }
</style>
</head>
<body>
<main>
  <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-3V5a2 2 0 0 0-2-2H9a2 2 0 0 0-2 2v2H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2Z"></path><path d="M8 7h8M12 12v5M9.5 14.5h5"></path></svg></div>
  <div class="eyebrow">Hablemos de tu próximo producto</div>
  <h1>Construyamos algo que sí mueva el negocio.</h1>
  <p>Arquitectura, modernización, productos SaaS e ingeniería aplicada con IA para convertir necesidades operativas en software claro y sostenible.</p>
  <div class="actions">
    <a class="primary" href="../?contact=1">Iniciar conversación <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
    <a class="secondary" href="../#portfolio-title">Ver portafolio</a>
  </div>
  <div class="note">Responderé personalmente a tu solicitud.</div>
</main>
</body>
</html>
