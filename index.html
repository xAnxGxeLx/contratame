<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>José Ángel Gaytán Pérez — CV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        oklch(0.985 0.004 95);
    --surface:   oklch(1 0 0);
    --ink:       oklch(0.24 0.012 75);
    --ink-soft:  oklch(0.46 0.012 75);
    --ink-faint: oklch(0.62 0.012 75);
    --line:      oklch(0.90 0.006 85);
    --line-soft: oklch(0.94 0.005 85);
    --accent:    oklch(0.55 0.15 264);
    --accent-soft: oklch(0.55 0.15 264 / 0.10);
    --accent-ink: oklch(0.45 0.15 264);
    --chip:      oklch(0.96 0.005 90);
    --shadow: 0 1px 2px oklch(0.3 0.02 75 / 0.04), 0 8px 30px oklch(0.3 0.02 75 / 0.06);
    --radius: 16px;
  }
  html[data-theme="dark"] {
    --bg:        oklch(0.20 0.012 270);
    --surface:   oklch(0.245 0.014 270);
    --ink:       oklch(0.94 0.006 90);
    --ink-soft:  oklch(0.74 0.01 90);
    --ink-faint: oklch(0.60 0.01 90);
    --line:      oklch(0.34 0.014 270);
    --line-soft: oklch(0.30 0.014 270);
    --accent:    oklch(0.74 0.13 264);
    --accent-soft: oklch(0.74 0.13 264 / 0.16);
    --accent-ink: oklch(0.80 0.12 264);
    --chip:      oklch(0.29 0.015 270);
    --shadow: 0 1px 2px oklch(0 0 0 / 0.2), 0 10px 34px oklch(0 0 0 / 0.30);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    transition: background .35s ease, color .35s ease;
  }
  .mono { font-family: "IBM Plex Mono", monospace; }
  h1, h2, h3, .display { font-family: "Space Grotesk", sans-serif; }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px;
    padding: 14px clamp(18px, 5vw, 56px);
    background: color-mix(in oklch, var(--bg) 82%, transparent);
    backdrop-filter: blur(14px) saturate(1.4);
    border-bottom: 1px solid var(--line-soft);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .monogram {
    width: 38px; height: 38px; border-radius: 11px;
    display: grid; place-items: center;
    background: var(--accent); color: white;
    font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 16px;
    letter-spacing: -0.5px;
    box-shadow: 0 4px 14px var(--accent-soft);
  }
  .brand .who { display: flex; flex-direction: column; line-height: 1.15; }
  .brand .who b { font-family: "Space Grotesk"; font-weight: 600; font-size: 14.5px; }
  .brand .who span { font-size: 11.5px; color: var(--ink-faint); }
  .controls { display: flex; align-items: center; gap: 8px; }

  .lang-toggle {
    display: inline-flex; align-items: center;
    border: 1px solid var(--line); border-radius: 999px;
    padding: 3px; background: var(--surface);
    font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600;
  }
  .lang-toggle button {
    border: 0; background: transparent; cursor: pointer;
    color: var(--ink-faint);
    padding: 5px 11px; border-radius: 999px;
    transition: color .2s, background .2s;
  }
  .lang-toggle button[aria-pressed="true"] { background: var(--accent); color: #fff; }

  .icon-btn {
    width: 36px; height: 36px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface);
    color: var(--ink-soft); cursor: pointer;
    display: grid; place-items: center;
    transition: border-color .2s, color .2s, transform .15s;
  }
  .icon-btn:hover { color: var(--accent-ink); border-color: var(--accent); transform: translateY(-1px); }
  .icon-btn svg { width: 17px; height: 17px; }

  .btn-pdf {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--line); background: var(--surface);
    color: var(--ink); cursor: pointer;
    font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600;
    padding: 8px 13px; border-radius: 10px;
    transition: border-color .2s, color .2s, transform .15s;
  }
  .btn-pdf:hover { color: var(--accent-ink); border-color: var(--accent); transform: translateY(-1px); }
  .btn-pdf svg { width: 15px; height: 15px; }

  /* ---------- Layout ---------- */
  .page { max-width: 1080px; margin: 0 auto; padding: clamp(28px, 5vw, 64px) clamp(18px, 5vw, 56px) 90px; }

  /* ---------- Hero ---------- */
  .hero { margin-bottom: 14px; }
  .eyebrow {
    font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 500;
    letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent-ink);
    display: flex; align-items: center; gap: 9px; margin-bottom: 18px;
  }
  .eyebrow::before { content: ""; width: 26px; height: 1.5px; background: var(--accent); display: inline-block; }
  .hero h1 {
    font-size: clamp(40px, 7vw, 68px); font-weight: 700; letter-spacing: -2px;
    line-height: 1.02; margin-bottom: 12px; text-wrap: balance;
  }
  .hero .role {
    font-family: "Space Grotesk"; font-size: clamp(18px, 2.6vw, 24px); font-weight: 500;
    color: var(--accent-ink); margin-bottom: 22px;
  }
  .hero .summary { font-size: 16.5px; color: var(--ink-soft); max-width: 64ch; text-wrap: pretty; }

  /* ---------- Contact bar ---------- */
  .contactbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    margin-top: 28px; padding-top: 26px; border-top: 1px solid var(--line-soft);
  }
  .contactbar-left, .contactbar-right {
    display: inline-flex; flex-wrap: wrap; align-items: center; gap: 10px;
  }
  .contactbar-right { margin-left: auto; }
  @media (max-width: 640px) {
    .contactbar-right { margin-left: 0; }
  }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 14px;
    font-size: 13.5px; color: var(--ink-soft); text-decoration: none;
    transition: border-color .2s, color .2s, transform .15s;
  }
  a.pill:hover { color: var(--accent-ink); border-color: var(--accent); transform: translateY(-1px); }
  .pill svg { width: 15px; height: 15px; color: var(--ink-faint); }
  a.pill:hover svg { color: var(--accent-ink); }
  .pill.masked { user-select: none; cursor: not-allowed; opacity: .85; }
  .pill .masked-val {
    filter: blur(5px); letter-spacing: 1px;
    font-family: "IBM Plex Mono", monospace;
    pointer-events: none;
  }
  .reveal-btn {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--accent-soft); border: 1px solid transparent;
    color: var(--accent-ink); cursor: pointer;
    border-radius: 999px; padding: 8px 14px;
    font-family: "IBM Plex Mono", monospace; font-size: 12.5px; font-weight: 600;
    transition: background .2s, transform .15s;
  }
  .reveal-btn:hover { transform: translateY(-1px); }
  .reveal-btn svg { width: 14px; height: 14px; }
  .privacy-note {
    font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--ink-faint);
    flex-basis: 100%; margin-top: 2px; display: flex; align-items: center; gap: 6px;
  }
  .privacy-note svg { width: 13px; height: 13px; }

  /* ---------- Contact modal ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 100;
    background: color-mix(in oklch, var(--bg) 30%, transparent);
    backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center;
    padding: 20px;
    animation: fade-in .2s ease;
  }
  .modal-backdrop.open { display: flex; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slide-up {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }
  .modal {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
    width: 100%; max-width: 460px;
    padding: 28px 26px 24px;
    animation: slide-up .25s cubic-bezier(.2,.7,.2,1);
  }
  .modal h3 {
    font-family: "Space Grotesk", sans-serif; font-size: 20px; font-weight: 600;
    margin-bottom: 4px;
  }
  .modal .modal-sub {
    font-size: 13.5px; color: var(--ink-soft); margin-bottom: 18px; text-wrap: pretty;
  }
  .modal .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .modal label {
    font-family: "IBM Plex Mono", monospace; font-size: 11.5px;
    color: var(--ink-faint); letter-spacing: .5px;
  }
  .modal input, .modal textarea {
    width: 100%; font: inherit; font-size: 14px;
    background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px;
    transition: border-color .2s;
  }
  .modal input:focus, .modal textarea:focus {
    outline: none; border-color: var(--accent);
  }
  .modal textarea { resize: vertical; min-height: 76px; font-family: inherit; }
  .modal-actions {
    display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;
  }
  .btn {
    border: 1px solid var(--line); background: var(--surface);
    color: var(--ink); cursor: pointer;
    font-family: "IBM Plex Mono", monospace; font-size: 12.5px; font-weight: 600;
    padding: 9px 16px; border-radius: 10px;
    transition: border-color .2s, color .2s, transform .15s, background .2s;
  }
  .btn:hover { transform: translateY(-1px); border-color: var(--accent); color: var(--accent-ink); }
  .btn-primary {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  .btn-primary:hover { color: #fff; border-color: var(--accent); filter: brightness(1.05); }
  .btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
  .modal-status {
    font-family: "IBM Plex Mono", monospace; font-size: 12px;
    margin-top: 10px; min-height: 1.2em;
  }
  .modal-status.error { color: oklch(0.55 0.22 25); }
  .modal-status.ok    { color: oklch(0.55 0.18 150); }
  .modal-success {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 14px 4px 4px; text-align: center;
  }
  .modal-success svg { width: 44px; height: 44px; color: oklch(0.62 0.18 150); }
  .modal-success h3 { margin-bottom: 2px; }
  .modal-success p { font-size: 13.5px; color: var(--ink-soft); }

  /* ---------- Body grid ---------- */
  .portfolio-section { margin-top: 62px; }
  .portfolio-intro {
    max-width: 62ch; margin: -8px 0 24px;
    color: var(--ink-soft); font-size: 15px; text-wrap: pretty;
  }
  .portfolio-grid {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px;
  }
  .project-card {
    display: block; min-width: 0; overflow: hidden; border: 1px solid var(--line);
    border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow);
    color: inherit; text-decoration: none; transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .project-card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 14px 36px var(--accent-soft); }
  .project-visual {
    position: relative; min-height: 212px; overflow: hidden; padding: 16px;
    background: linear-gradient(145deg, color-mix(in oklch, var(--accent) 15%, var(--bg)), var(--chip));
  }
  .project-visual::after {
    content: ""; position: absolute; width: 150px; height: 150px; border-radius: 999px;
    right: -65px; bottom: -75px; background: var(--accent-soft); filter: blur(2px);
  }
  .visual-label {
    position: relative; z-index: 2; display: inline-flex; border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 8px; background: color-mix(in oklch, var(--surface) 78%, transparent);
    color: var(--ink-faint); font: 500 10px "IBM Plex Mono", monospace; letter-spacing: .45px; text-transform: uppercase;
  }
  .compare-frames { position: absolute; inset: 49px 16px 15px; z-index: 1; display: grid; grid-template-columns: 1fr 18px 1fr; align-items: center; gap: 7px; }
  .compare-arrow { color: var(--accent-ink); font: 600 17px "Space Grotesk", sans-serif; text-align: center; }
  .screen {
    height: 132px; overflow: hidden; border: 1px solid color-mix(in oklch, var(--line) 85%, var(--accent));
    border-radius: 9px; background: var(--surface); box-shadow: 0 8px 18px oklch(0.26 0.02 260 / .10);
  }
  .screen-top { height: 15px; padding: 5px 6px; background: color-mix(in oklch, var(--chip) 88%, var(--accent-soft)); }
  .screen-top::before { content: ""; display: block; width: 23px; height: 4px; border-radius: 99px; background: var(--ink-faint); opacity: .45; }
  .legacy-ui { padding: 8px; }
  .legacy-ui .legacy-row { height: 8px; margin-bottom: 8px; border-radius: 2px; background: color-mix(in oklch, var(--ink-faint) 22%, transparent); }
  .legacy-ui .legacy-row:nth-child(2) { width: 78%; }
  .legacy-ui .legacy-row:nth-child(3) { width: 56%; }
  .legacy-ui .legacy-button { width: 47%; height: 15px; margin-top: 13px; border-radius: 2px; background: oklch(0.52 0.08 40 / .55); }
  .modern-ui { padding: 9px; display: grid; grid-template-columns: 24px 1fr; gap: 7px; }
  .modern-ui .modern-nav { height: 96px; border-radius: 4px; background: var(--accent); }
  .modern-ui .modern-main { display: grid; grid-template-rows: 25px 1fr; gap: 7px; }
  .modern-ui .modern-hero { border-radius: 4px; background: var(--accent-soft); }
  .modern-ui .modern-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .modern-ui .modern-panels span { border-radius: 4px; background: color-mix(in oklch, var(--accent) 24%, var(--surface)); }
  .pos-ui { padding: 9px; display: grid; grid-template-columns: 29px 1fr; gap: 7px; }
  .pos-ui .pos-nav { border-radius: 4px; background: oklch(0.32 0.06 265); }
  .pos-ui .pos-main { display: grid; grid-template-rows: 18px 1fr; gap: 7px; }
  .pos-ui .pos-title { border-radius: 4px; background: var(--accent-soft); }
  .pos-ui .pos-products { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  .pos-ui .pos-products span { min-height: 38px; border-radius: 4px; background: color-mix(in oklch, var(--accent) 21%, var(--surface)); }
  .pos-ui .pos-products span:last-child { background: var(--accent); }
  .ai-ui { padding: 10px; }
  .ai-ui .ai-prompt { height: 24px; border-radius: 5px; background: color-mix(in oklch, var(--accent) 19%, var(--surface)); }
  .ai-ui .ai-flow { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
  .ai-ui .ai-flow span { display: block; width: 22px; height: 22px; border-radius: 6px; background: var(--accent); box-shadow: 0 3px 7px var(--accent-soft); }
  .ai-ui .ai-flow i { width: 17px; height: 1px; background: var(--accent-ink); opacity: .7; }
  .ai-ui .ai-result { height: 37px; margin-top: 14px; border: 1px solid var(--accent-soft); border-radius: 5px; background: var(--surface); }
  .project-copy { padding: 17px 18px 19px; }
  .project-meta { color: var(--accent-ink); font: 600 11.5px "IBM Plex Mono", monospace; letter-spacing: .45px; text-transform: uppercase; }
  .project-copy h3 { margin-top: 7px; font-size: 18px; line-height: 1.2; letter-spacing: -.35px; }
  .project-copy p { margin-top: 8px; color: var(--ink-soft); font-size: 13.5px; text-wrap: pretty; }
  .project-result { display: block; margin-top: 13px; color: var(--ink); font: 500 12px "IBM Plex Mono", monospace; }
  .project-result::before { content: "↗ "; color: var(--accent-ink); }
  @media (max-width: 820px) { .portfolio-grid { grid-template-columns: 1fr; } .project-visual { min-height: 230px; } }

  .grid {
    display: grid; grid-template-columns: 1.65fr 1fr; gap: clamp(28px, 4vw, 56px);
    margin-top: 56px; align-items: start;
  }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; gap: 40px; } }

  .section + .section { margin-top: 44px; }
  .section-title {
    font-family: "IBM Plex Mono", monospace; font-size: 12.5px; font-weight: 600;
    letter-spacing: 1.5px; text-transform: uppercase; color: var(--ink-faint);
    margin-bottom: 22px; display: flex; align-items: center; gap: 10px;
  }
  .section-title .idx { color: var(--accent-ink); }

  /* Experience timeline */
  .job { position: relative; padding-left: 26px; padding-bottom: 30px; }
  .job::before {
    content: ""; position: absolute; left: 4px; top: 6px; bottom: -6px;
    width: 1.5px; background: var(--line);
  }
  .job:last-child::before { display: none; }
  .job::after {
    content: ""; position: absolute; left: 0; top: 5px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 0 4px var(--bg);
  }
  .job-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
  .job-title { font-family: "Space Grotesk"; font-size: 18px; font-weight: 600; }
  .job-co { font-size: 14.5px; color: var(--accent-ink); font-weight: 500; }
  .job-date {
    font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-faint);
    white-space: nowrap;
  }
  .job ul { list-style: none; margin-top: 12px; display: flex; flex-direction: column; gap: 7px; }
  .job li { position: relative; padding-left: 18px; font-size: 14.5px; color: var(--ink-soft); text-wrap: pretty; }
  .job li::before { content: "—"; position: absolute; left: 0; color: var(--accent); }

  /* Sidebar cards */
  .card {
    background: var(--surface); border: 1px solid var(--line-soft);
    border-radius: var(--radius); padding: 22px 22px 24px; box-shadow: var(--shadow);
  }
  .card + .card { margin-top: 18px; }
  .skill-group + .skill-group { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line-soft); }
  .skill-label { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--ink-faint); margin-bottom: 9px; letter-spacing: .5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    background: var(--chip); border: 1px solid var(--line-soft);
    border-radius: 8px; padding: 5px 10px; font-size: 12.5px; color: var(--ink);
    font-family: "IBM Plex Mono", monospace; font-weight: 500;
  }
  .edu-item + .edu-item { margin-top: 16px; }
  .edu-item h3 { font-family: "Space Grotesk"; font-size: 15.5px; font-weight: 600; margin-bottom: 3px; }
  .edu-item p { font-size: 13.5px; color: var(--ink-soft); }
  .edu-item .meta { font-family: "IBM Plex Mono"; font-size: 11.5px; color: var(--ink-faint); margin-top: 3px; }
  .soft-list { display: flex; flex-direction: column; gap: 10px; }
  .soft-list div { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-soft); }
  .soft-list .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

  footer {
    margin-top: 70px; padding-top: 24px; border-top: 1px solid var(--line-soft);
    font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-faint);
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }

  /* Entrance animation */
  @media (prefers-reduced-motion: no-preference) {
    .reveal-anim { opacity: 0; transform: translateY(14px); }
    .reveal-anim.in { opacity: 1; transform: none; transition: opacity .6s ease, transform .6s cubic-bezier(.2,.7,.2,1); }
  }

  /* Print */
  @media print {
    .topbar, footer, .reveal-btn, .icon-btn, .btn-pdf, .lang-toggle, .portfolio-section { display: none !important; }
    body { background: #fff; }
    .page { padding: 0; max-width: none; }
    .card { box-shadow: none; }
    .pill .masked-val { filter: none !important; letter-spacing: 0 !important; }
    .grid { gap: 32px; }
    .reveal-anim { opacity: 1 !important; transform: none !important; }
    @page { margin: 14mm; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="monogram">JG</div>
      <div class="who">
        <b>José Ángel Gaytán</b>
        <span data-i18n="navrole"></span>
      </div>
    </div>
    <div class="controls">
      <div class="lang-toggle" role="group" aria-label="Idioma / Language">
        <button id="btn-es" aria-pressed="true" onclick="setLang('es')">ES</button>
        <button id="btn-en" aria-pressed="false" onclick="setLang('en')">EN</button>
      </div>

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function projectVisual(type, label){
  const tag = `<span class="visual-label">${esc(label)}</span>`;
  if (type === "compare") return `
    <div class="project-visual">${tag}
      <div class="compare-frames" aria-hidden="true">
        <div class="screen"><div class="screen-top"></div><div class="legacy-ui"><div class="legacy-row"></div><div class="legacy-row"></div><div class="legacy-row"></div><div class="legacy-button"></div></div></div>
        <span class="compare-arrow">→</span>
        <div class="screen"><div class="screen-top"></div><div class="modern-ui"><div class="modern-nav"></div><div class="modern-main"><div class="modern-hero"></div><div class="modern-panels"><span></span><span></span></div></div></div></div>
      </div>
    </div>`;
  if (type === "pos") return `
    <div class="project-visual">${tag}
      <div class="compare-frames" aria-hidden="true" style="grid-template-columns:1fr;">
        <div class="screen"><div class="screen-top"></div><div class="pos-ui"><div class="pos-nav"></div><div class="pos-main"><div class="pos-title"></div><div class="pos-products"><span></span><span></span><span></span><span></span><span></span><span></span></div></div></div></div>
      </div>
    </div>`;
  return `
    <div class="project-visual">${tag}
      <div class="compare-frames" aria-hidden="true" style="grid-template-columns:1fr;">
        <div class="screen"><div class="screen-top"></div><div class="ai-ui"><div class="ai-prompt"></div><div class="ai-flow"><span></span><i></i><span></span><i></i><span></span><i></i><span></span></div><div class="ai-result"></div></div></div>
      </div>
    </div>`;
}

function render(){
  const d = DATA[lang];
  document.documentElement.lang = lang;

  document.querySelectorAll("[data-i18n]").forEach(el => {
    const k = el.getAttribute("data-i18n");
    if (d[k] !== undefined) el.textContent = d[k];
  });

  // Portfolio
  document.getElementById("portfolio-grid").innerHTML = d.portfolioCases.map(p => `
    <a class="project-card" href="${esc(p.href)}" aria-label="${esc(p.title)}"${p.external ? ' target="_blank" rel="noopener"' : ""}>
      ${projectVisual(p.type, p.label)}
      <div class="project-copy">
        <div class="project-meta">${esc(p.label)}</div>
        <h3>${esc(p.title)}</h3>
        <p>${esc(p.description)}</p>
        <span class="project-result">${esc(p.result)}</span>
      </div>
    </a>`).join("");

  // Experience
  document.getElementById("exp-list").innerHTML = d.experience.map(j => `
    <div class="job">
      <div class="job-head">
        <span class="job-title">${esc(j.title)} <span class="job-co">· ${esc(j.co)}</span></span>
        <span class="job-date">${esc(j.date)}</span>
      </div>
      <ul>${j.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
    </div>`).join("");

  // Skills
  document.getElementById("skills-card").innerHTML = d.skillGroups.map(g => `
    <div class="skill-group">
      <div class="skill-label">${esc(g.label)}</div>
      <div class="chips">${g.items.map(i => `<span class="chip">${esc(i)}</span>`).join("")}</div>
    </div>`).join("");

  // Education
  document.getElementById("edu-card").innerHTML = d.education.map(e => `
    <div class="edu-item"><h3>${esc(e.degree)}</h3><p>${esc(e.school)}</p><div class="meta">${esc(e.meta)}</div></div>`).join("");

  // Certifications
  document.getElementById("certs-card").innerHTML = d.certifications.map(e => `
    <div class="edu-item"><h3>${esc(e.degree)}</h3><p>${esc(e.school)}</p><div class="meta">${esc(e.meta)}</div></div>`).join("");

  // Soft skills
  document.getElementById("soft-list").innerHTML = d.softSkills.map(s => `
    <div><span class="dot"></span>${esc(s)}</div>`).join("");
}

function setLang(l){
  lang = l;
  localStorage.setItem("cv-lang", l);
  document.getElementById("btn-es").setAttribute("aria-pressed", l==="es");
  document.getElementById("btn-en").setAttribute("aria-pressed", l==="en");
  render();
}

/* ============ CONTACT MODAL ============ */
function openContactModal(){
  const modal = document.getElementById("contact-modal");
  document.getElementById("modal-form-view").style.display = "";
  document.getElementById("modal-success-view").style.display = "none";
  document.getElementById("contact-form").reset();
  document.getElementById("modal-status").textContent = "";
  document.getElementById("modal-status").className = "modal-status";
  modal.classList.add("open");
  document.body.style.overflow = "hidden";
  setTimeout(() => document.getElementById("cf-email").focus(), 80);
}

function closeContactModal(){
  document.getElementById("contact-modal").classList.remove("open");
  document.body.style.overflow = "";
}

async function submitContact(ev){
  ev.preventDefault();
  const d = DATA[lang];
  const status = document.getElementById("modal-status");
  const submitBtn = document.getElementById("modal-submit");

  if (!WEB3FORMS_ACCESS_KEY || WEB3FORMS_ACCESS_KEY === "YOUR_WEB3FORMS_ACCESS_KEY") {
    status.textContent = d.modalKeyMissing;
    status.className = "modal-status error";
    return;
  }

  const email = document.getElementById("cf-email").value.trim();
  const name  = document.getElementById("cf-name").value.trim();
  const msg   = document.getElementById("cf-msg").value.trim();

  submitBtn.disabled = true;
  const originalLabel = submitBtn.textContent;
  submitBtn.textContent = d.modalSending;
  status.textContent = "";
  status.className = "modal-status";

  try {
    const res = await fetch("https://api.web3forms.com/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({
        access_key: WEB3FORMS_ACCESS_KEY,
        subject: "[CV] Solicitud de contacto desde " + (name || email),
        from_name: name || email,
        replyto: email,
        email,
        name,
        message: msg || "(sin mensaje)"
      })
    });
    const json = await res.json();
    if (json.success) {
      document.getElementById("modal-form-view").style.display = "none";
      document.getElementById("modal-success-view").style.display = "";
    } else {
      throw new Error(json.message || "submit_failed");
    }
  } catch (err) {
    status.textContent = d.modalError;
    status.className = "modal-status error";
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = originalLabel;
  }
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && document.getElementById("contact-modal").classList.contains("open")) {
    closeContactModal();
  }
});

/* ============ THEME ============ */
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  localStorage.setItem("cv-theme", t);
  const icon = document.getElementById("theme-icon");
  if (t === "dark") {
    icon.innerHTML = '<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"></path>';
  } else {
    icon.innerHTML = '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>';
  }
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute("data-theme");
  applyTheme(cur === "dark" ? "light" : "dark");
}

/* ============ INIT ============ */
(function init(){
  const savedTheme = localStorage.getItem("cv-theme")
    || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  applyTheme(savedTheme);
  const savedLang = localStorage.getItem("cv-lang") || "es";
  setLang(savedLang);

  // entrance animations
  if (window.matchMedia("(prefers-reduced-motion: no-preference)").matches) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold: 0.08 });
    document.querySelectorAll(".reveal-anim").forEach((el, i) => {
      el.style.transitionDelay = (i * 60) + "ms";
      io.observe(el);
    });
    // Fallback: if the observer never fires (background/offscreen iframe, paint timing),
    // make sure nothing stays stuck at opacity:0.
    setTimeout(() => {
      document.querySelectorAll(".reveal-anim:not(.in)").forEach(el => el.classList.add("in"));
    }, 500);
  } else {
    document.querySelectorAll(".reveal-anim").forEach(el => el.classList.add("in"));
  }
})();
</script>
